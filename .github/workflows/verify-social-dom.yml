name: Vérifier la maquette Parc social en navigateur DOM
on:
  push:
    paths:
      - public/social-reference.js
      - public/social-reference.css
      - scripts/verify-social-dom.js
      - .github/workflows/verify-social-dom.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts jsdom@26.1.0
      - run: node scripts/verify-social-dom.js
