name: Examiner portrait INSEE
on:
  push:
    paths: ['scripts/probe-persona-insee.js','.github/workflows/probe-persona-insee.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-persona-insee.js
