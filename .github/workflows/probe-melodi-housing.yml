name: Probe API Melodi INSEE logement
on:
  push:
    paths: [scripts/probe-melodi-housing.py,.github/workflows/probe-melodi-housing.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests
      - run: python scripts/probe-melodi-housing.py
