name: Examiner sources municipales 2026 2020 2014 2008
on:
  push:
    paths: [scripts/probe-elections-officielles.js,.github/workflows/probe-elections-officielles.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/probe-elections-officielles.js
