name: Pré-calcul INSEE migrations 2023
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-migrations-cache.js'
      - 'migrations-detail-insee.js'
      - '.github/workflows/migrations-cache.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: migrations-data-cache
  cancel-in-progress: false
jobs:
  build-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev
      - name: Télécharger le fichier INSEE avec reprise en cas de coupure
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.insee.fr/fr/statistiques/fichier/9004805/RP2023_migcom.zip"
          for attempt in $(seq 1 8); do
            echo "Téléchargement tentative $attempt"
            curl --http1.1 --fail --location --connect-timeout 45 --max-time 600 --retry 1 --retry-delay 3 --output /tmp/RP2023_migcom.zip "$URL" || true
            if unzip -tq /tmp/RP2023_migcom.zip >/dev/null 2>&1; then echo "Archive valide";break;fi
            if [ "$attempt" -eq 8 ]; then echo "Archive INSEE impossible à récupérer intégralement";exit 1;fi
            sleep 4
          done
      - name: Agréger les observations par commune
        run: node scripts/build-migrations-cache.js
        env:
          MIGRATION_COMMUNES: '85081'
          MIGCOM_ZIP: '/tmp/RP2023_migcom.zip'
      - name: Publier uniquement les agrégats de mobilité
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/migrations-85081.json
          if ! git diff --cached --quiet; then
            git commit -m "Cache INSEE officiel migrations 2023 Dompierre-sur-Yon"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
