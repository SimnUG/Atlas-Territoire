name: Examiner colonnes municipales 2026 2020
on:
  push:
    paths: [scripts/probe-election-schemas.js,.github/workflows/probe-election-schemas.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/probe-election-schemas.js
